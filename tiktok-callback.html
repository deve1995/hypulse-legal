<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Connecting TikTok - Hypulse</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      background: #07111f;
      color: #ffffff;

      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 420px;

      background: #101c2c;

      border:
        1px solid #213044;

      border-radius: 24px;

      padding: 32px;

      text-align: center;
    }

    .logo {
      font-size: 30px;
      font-weight: 900;
    }

    .accent {
      color: #22d3c5;
    }

    .loader {
      width: 50px;
      height: 50px;

      border-radius: 50%;

      border:
        4px solid #213044;

      border-top-color:
        #22d3c5;

      margin:
        28px auto;

      animation:
        spin 0.9s linear infinite;
    }

    h1 {
      font-size: 21px;
      margin: 0;
    }

    p {
      color: #aeb8c6;

      font-size: 14px;

      line-height: 1.6;

      margin-top: 10px;
    }

    @keyframes spin {
      to {
        transform:
          rotate(360deg);
      }
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="logo">
      Hy<span class="accent">pulse</span>
    </div>

    <div class="loader"></div>

    <h1>
      Connecting TikTok...
    </h1>

    <p>
      Please wait while Hypulse securely completes
      your TikTok connection.
    </p>

  </div>


  <script>
    const callbackUrl =
      'https://woqfyjdwamxobalbtcur.supabase.co/functions/v1/tiktok-oauth-callback';

    const currentQuery =
      window.location.search;

    window.location.replace(
      callbackUrl +
      currentQuery
    );
  </script>

</body>
</html>
