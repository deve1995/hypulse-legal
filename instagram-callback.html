<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Hypulse - Instagram</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;

      background: #07111f;
      color: #ffffff;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }

    .card {
      width: 100%;
      max-width: 420px;

      padding: 32px 24px;

      background: #101c2c;

      border: 1px solid #213044;
      border-radius: 24px;

      text-align: center;
    }

    .logo {
      font-size: 30px;
      font-weight: 900;
      margin-bottom: 20px;
    }

    .accent {
      color: #22d3c5;
    }

    .spinner {
      width: 42px;
      height: 42px;

      margin: 0 auto 20px;

      border: 4px solid #213044;
      border-top-color: #22d3c5;
      border-radius: 50%;

      animation: spin 0.8s linear infinite;
    }

    h1 {
      font-size: 20px;
      margin: 0 0 10px;
    }

    p {
      color: #aeb8c6;
      font-size: 14px;
      line-height: 1.6;
      margin: 0;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="logo">
      Hy<span class="accent">pulse</span>
    </div>

    <div class="spinner"></div>

    <h1>Connecting Instagram...</h1>

    <p>
      Please wait while Hypulse completes
      your Instagram connection.
    </p>
  </div>

  <script>
    const CALLBACK_URL =
      "https://woqfyjdwamxobalbtcur.supabase.co/functions/v1/instagram-oauth-callback";

    const params =
      new URLSearchParams(
        window.location.search
      );

    const target =
      new URL(CALLBACK_URL);

    params.forEach(
      (value, key) => {
        target.searchParams.set(
          key,
          value
        );
      }
    );

    window.location.replace(
      target.toString()
    );
  </script>
</body>
</html>
